[project]
name = "zkvault"
version = "2.0.0.dev0"
description = "Local-first, zero-knowledge password manager"
requires-python = ">=3.11"
dependencies = ["pynacl>=1.5.0", "httpx>=0.27"]

[project.scripts]
zkvault = "zkvault.cli:main"

[project.optional-dependencies]
server = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "sqlalchemy>=2.0",
  "pydantic>=2.7", "pydantic-settings>=2.3", "email-validator>=2.1",
  "argon2-cffi>=23.1", "python-jose[cryptography]>=3.3", "pyotp>=2.9",
]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["zkvault*"]

[tool.setuptools.package-data]
zkvault = ["data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
